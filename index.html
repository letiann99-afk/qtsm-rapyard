<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAP YARD | QTSM Industrial</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white font-sans selection:bg-[#FFCC00] selection:text-black">

    <!-- Hero Section -->
    <section class="min-h-screen flex flex-col items-center justify-center px-6 border-b border-[#333]">
        <div class="max-w-4xl text-center">
            <h1 class="text-6xl md:text-8xl font-black tracking-tighter italic mb-4 uppercase">
                RAP <span class="text-[#FFCC00]">YARD</span>
            </h1>
            <p class="text-xl md:text-2xl text-gray-400 font-mono tracking-widest uppercase mb-8">
                Record • Upload • Share • Listen
            </p>
            <div class="flex gap-4 justify-center">
                <button class="bg-[#FFCC00] text-black font-bold py-3 px-8 rounded-sm hover:scale-105 transition-transform uppercase tracking-tighter">
                    Launch App
                </button>
                <button class="border-2 border-white font-bold py-3 px-8 rounded-sm hover:bg-white hover:text-black transition-all uppercase tracking-tighter">
                    View Tracks
                </button>
            </div>
        </div>
    </section>

    <!-- Branding Element -->
    <div class="fixed bottom-8 right-8 text-[#333] font-black text-2xl select-none">
        QTSM_MODULAR
    </div>

</body>
</html>
