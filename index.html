<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAP YARD | QTSM</title>
    <!-- This line is critical for the "Industrial" styles to work -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-[#0f0f0f] text-white antialiased">

    <!-- Hero Section -->
    <section class="min-h-screen flex flex-col items-center justify-center p-8 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-[#1a1a1a] to-[#0f0f0f]">
        
        <!-- Industrial Branding Header -->
        <div class="text-center mb-12">
            <h1 class="text-7xl md:text-9xl font-black italic tracking-tighter uppercase leading-none text-white">
                RAP <span class="text-[#FFCC00] drop-shadow-[0_0_15px_rgba(255,204,0,0.3)]">YARD</span>
            </h1>
            <div class="h-1 w-32 bg-[#FFCC00] mx-auto mt-4"></div>
            <p class="mt-6 text-lg md:text-xl font-mono text-gray-400 tracking-[0.4em] uppercase">
                Record • Upload • Share
            </p>
        </div>

        <!-- Call to Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-6 w-full max-w-lg">
            <button class="flex-1 bg-[#FFCC00] text-black font-black py-5 px-8 uppercase tracking-widest hover:bg-white hover:scale-105 transition-all shadow-xl">
                Start Recording
            </button>
            <button class="flex-1 border-2 border-white text-white font-black py-5 px-8 uppercase tracking-widest hover:bg-white hover:text-black transition-all">
                Explore Feed
            </button>
        </div>

        <!-- QTSM Modular Tag -->
        <div class="mt-24 opacity-20 font-black text-xs tracking-[1em] uppercase border-t border-gray-800 pt-4">
            QTSM_INDUSTRIAL_SYSTEM_V.01
        </div>
    </section>

</body>
</html>
